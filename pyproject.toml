[project]
name = "jobs-pipeline"
version = "0.1.0"
description = "Pipeline ELT de ofertas de empleo: CSV -> PostgreSQL (raw -> staging -> modelo 3FN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Solo para correr el pipeline orquestado (jobs-flow); el CLI normal no lo necesita.
orchestration = [
    "prefect>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jobs-pipeline = "jobs_pipeline.pipeline:main"
jobs-flow = "jobs_pipeline.flow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requieren una base PostgreSQL disponible (se saltan si no hay conexión)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
